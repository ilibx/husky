# 默认菜单配置
# roles: 空=全部角色可见, 多个角色用逗号分隔
menus:
  - name: 仪表盘
    path: /dashboard
    icon: Odometer
    sort: 0

  - name: 工单管理
    icon: Ticket
    sort: 10
    children:
      - name: 全部工单
        path: /tickets
        sort: 1
      - name: 我的待办
        path: /tasks
        sort: 2

  - name: 智能服务
    icon: Cpu
    sort: 20
    children:
      - name: Agent 管理
        path: /agents
        sort: 1
      - name: SOP 管理
        path: /sops
        sort: 2
      - name: Skill 管理
        path: /skills
        sort: 3
      - name: MCP 服务
        path: /mcps
        sort: 4

  - name: 资料管理
    icon: Reading
    sort: 30
    children:
      - name: 文档管理
        path: /knowledge/docs
        sort: 1
      - name: 向量库配置
        path: /knowledge/config
        sort: 2
      - name: 资料检索
        path: /knowledge/search
        sort: 3

  - name: 系统管理
    icon: Setting
    sort: 40
    roles: admin
    children:
      - name: 部门管理
        path: /departments
        sort: 1
      - name: 角色管理
        path: /roles
        sort: 2
      - name: 用户管理
        path: /users
        sort: 3
      - name: 菜单管理
        path: /menus
        sort: 4
      - name: 分类管理
        path: /categories
        sort: 5
      - name: 标签管理
        path: /tags
        sort: 6

  - name: 通知管理
    icon: Bell
    sort: 45
    roles: admin
    children:
      - name: 通知列表
        path: /notifications
        sort: 1
      - name: 推送管理
        path: /push-config
        sort: 2
      - name: 等级管理
        path: /notification-levels
        sort: 3
      - name: SLA 配置
        path: /sla-configs
        sort: 4

  - name: 渠道管理
    icon: Connection
    sort: 50
    roles: admin
    children:
      - name: 渠道列表
        path: /channels/list
        sort: 1

  - name: 模型管理
    icon: Monitor
    sort: 60
    roles: admin
    children:
      - name: 平台管理
        path: /models/platforms
        sort: 1
      - name: 模型配置
        path: /models/configs
        sort: 2
