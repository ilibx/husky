# ==================== Server ====================
server:
  port: 8080

  base_path: ""             # empty = root "/", or set e.g. "/husky"

# ==================== Log ====================
log:
  level: info             # debug / info / warn / error
  format: console         # console / json

# ==================== Database ====================
database:
  provider: postgresql
  host: 192.168.2.12
  port: 5432
  username: dev 
  password: dev123 
  name: husky
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# ==================== Cache (optional, enable: false to disable) ====================
cache:
  enable: false
  provider: redis
  host: ""
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 5

# ==================== JWT ====================
jwt:
  secret: husky-secret-key-change-in-production
  expire_hour: 24

# ==================== LDAP (enable: false to disable) ====================
ldap:
  enable: false
  host: ""
  port: 389
  bind_dn: ""
  password: ""
  base_dn: ""
  filter: "(objectClass=person)"
  field_map: '{"cn":"username","mail":"email"}'

# ==================== Knowledge Storage ====================
storage:
  provider: local                # local / s3 / ftp / lark
  options:                       # provider-specific params
    root: ./data/knowledge       # local storage root

# ==================== CORS ====================
cors:
  allowed_origins: "*"
  allowed_methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allowed_headers: "Origin,Content-Type,Accept,Authorization,X-Requested-With"
